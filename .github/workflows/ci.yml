name: CI

on:
  push:
    branches: [determination, "feat/**", "fix/**", "demo/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 11.16.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval:smoke
      - run: pnpm demo:fixture
      - run: pnpm build
      # CI validates the repository/runtime contract with deliberately inert values.
      # This does not claim that credentialed TrueForge is reachable; local/live runs
      # still need real TRUEFORGE_BASE_URL and TRUEFORGE_MODEL values.
      - name: Run doctor with CI placeholders
        env:
          TRUEFORGE_BASE_URL: http://127.0.0.1:8790
          TRUEFORGE_MODEL: ci/placeholder
        run: pnpm run doctor
      - run: git diff --check
